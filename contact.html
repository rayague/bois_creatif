    <!-- Script pour gérer l'envoi vers WhatsApp -->
    <!-- Script pour gérer l'envoi vers WhatsApp -->
    <script>
      function sendToWhatsApp() {
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message").value.trim();

        const text = `Bonjour, je suis ${name}.
Téléphone : ${phone}
Email : ${email}
Message : ${message}`;

        const whatsappNumber = "22996084587"; // format international sans "+"
        const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(
          text
        )}`;

        window.open(url, "_blank");
      }
    </script>
    <script>
      var map = L.map("map").setView([6.4476, 2.4235], 13); // Coordonnées d'Abomey-Calavi

      // Ajouter une couche de carte OpenStreetMap
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // Ajouter un marqueur à Abomey-Calavi
      L.marker([6.4476, 2.4235])
        .addTo(map)
        .bindPopup("<b>Abomey-Calavi</b><br>Lieu de notre entreprise.")
        .openPopup();
    </script>
